# ==================== ANALYTICS SERVICE (Java) ====================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: linkly
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
    spec:
      containers:
      - name: analytics-service
        image: ghcr.io/alok2502/linkly-analytics-service:latest
        ports:
        - containerPort: 8081
        env:
        - name: SERVER_PORT
          value: "8081"
        resources:
          requests: {memory: "256Mi", cpu: "100m"}
          limits: {memory: "512Mi", cpu: "250m"}
        readinessProbe:
          httpGet: {path: /health, port: 8081}
          initialDelaySeconds: 15
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-service
  namespace: linkly
spec:
  selector:
    app: analytics-service
  ports:
  - port: 8081
    targetPort: 8081
