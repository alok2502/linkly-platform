# ==================== API GATEWAY (Go) ====================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: linkly
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: ghcr.io/alok2502/linkly-api-gateway:latest
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        resources:
          requests: {memory: "32Mi", cpu: "50m"}
          limits: {memory: "64Mi", cpu: "100m"}
        readinessProbe:
          httpGet: {path: /health, port: 8080}
          initialDelaySeconds: 3
        livenessProbe:
          httpGet: {path: /health, port: 8080}
          initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: linkly
spec:
  selector:
    app: api-gateway
  ports:
  - port: 8080
    targetPort: 8080
---
