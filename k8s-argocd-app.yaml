apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: linkly
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/alok2502/linkly-platform.git
    targetRevision: HEAD
    path: k8s                          # watch the k8s/ folder
  destination:
    server: https://kubernetes.default.svc
    namespace: linkly
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
